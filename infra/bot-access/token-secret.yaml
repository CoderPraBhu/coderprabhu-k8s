# Long-lived token for coderbotagent-k8s-viewer (GKE caps `kubectl create token` at 48h).
# No token in git: Kubernetes fills in .data.token inside the cluster. The bot's role cannot read Secrets.
# Rotate (old token dies at once):  kubectl -n bot-access delete secret coderbotagent-k8s-viewer-token
#   -> Flux recreates it within 10 min with a NEW token; then rerun 1-mac-create-access.sh access + reinstall on the bot.
# Revoke for good: remove this file (and infra/bot-access/) by PR, then delete the Secret by hand (prune is off).
apiVersion: v1
kind: Secret
metadata:
  name: coderbotagent-k8s-viewer-token
  namespace: bot-access
  annotations:
    kubernetes.io/service-account.name: coderbotagent-k8s-viewer
type: kubernetes.io/service-account-token
