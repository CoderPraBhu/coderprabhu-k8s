# HTTP -> HTTPS 301 for every host. Replaces FrontendConfig redirectToHttps.
# Hostname-agnostic: attached to the :80 listener, matches all hosts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  parentRefs:
  - name: allprojects-gateway
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
