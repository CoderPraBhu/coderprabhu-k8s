# whatsgoodonmenu.com — UI + API. Attached to the :443 listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-whatsgoodonmenu-ui
spec:
  parentRefs:
  - name: allprojects-gateway
    sectionName: https
  hostnames:
  - whatsgoodonmenu.com
  - www.whatsgoodonmenu.com
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: menu-ui-backend
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-whatsgoodonmenu-api
spec:
  parentRefs:
  - name: allprojects-gateway
    sectionName: https
  hostnames:
  - api.whatsgoodonmenu.com
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: menu-api-backend
      port: 8080
