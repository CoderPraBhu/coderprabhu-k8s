# tornacampsites.com rental micro-frontends + rentalapi.
# Each subdomain -> its own Service. Add a new rental MFE by appending an
# HTTPRoute doc here (and an A record + nothing else — *.tornacampsites.com is
# already covered by tornacampsites-wild). Attached to the :443 listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-rentalui-homepage
spec:
  parentRefs:
  - name: allprojects-gateway
    sectionName: https
  hostnames: [ rentals.tornacampsites.com ]
  rules:
  - matches: [ { path: { type: PathPrefix, value: / } } ]
    backendRefs: [ { name: rentalui-homepage, port: 5175 } ]
