# tornacampsites.com core — main UI + newapi. Rental micro-frontends and
# rentalapi are in httproute-rentalui.yaml. Attached to the :443 listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-tornacampsites-ui
spec:
  parentRefs:
  - name: allprojects-gateway
    sectionName: https
  hostnames:
  - tornacampsites.com
  - www.tornacampsites.com
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: new-camp-ui-backend
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-tornacampsites-newapi
spec:
  parentRefs:
  - name: allprojects-gateway
    sectionName: https
  hostnames:
  - newapi.tornacampsites.com
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: camp-newapi-backend
      port: 8080
